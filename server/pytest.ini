[pytest]
# §7.4 / §12.2 (AG-CI-04) di wiki/DIRECTIVES.md.
# I test del runtime/console sono eseguibili anche con la stdlib via
#   python -m unittest discover -s server/tests
# pytest resta lo strumento canonico per copertura (pytest-cov) quando installato.
testpaths = server/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    runtime: test del runtime operativo (metriche, middleware, backup, provisioning)
    console: test della console operativa
