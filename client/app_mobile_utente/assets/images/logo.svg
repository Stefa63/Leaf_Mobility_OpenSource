<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    LEAF Mobility logo — leaf/wheel fusion.
    A spoked wheel with a central leaf (midrib + branching veins),
    enclosed by a swirling wreath of 12 leaves. Brand green #4CAF50.
    Transparent background — used in AppBar, Drawer, Splash, Login.
  -->
  <defs>
    <!-- One swirling flame-leaf of the outer wreath (tip up, curving right). -->
    <path id="leaf"
      d="M50 4 C57 8 60 16 56.5 24 C54.5 29 51 30 50 24.5 C49 30 45.5 29 43.5 24 C40 16 43 8 50 4 Z"/>
  </defs>

  <g fill="#4CAF50">
    <!-- ═══ Outer leaf wreath: 12 leaves rotated every 30° ═══ -->
    <use href="#leaf" transform="rotate(0,50,50)"/>
    <use href="#leaf" transform="rotate(30,50,50)"/>
    <use href="#leaf" transform="rotate(60,50,50)"/>
    <use href="#leaf" transform="rotate(90,50,50)"/>
    <use href="#leaf" transform="rotate(120,50,50)"/>
    <use href="#leaf" transform="rotate(150,50,50)"/>
    <use href="#leaf" transform="rotate(180,50,50)"/>
    <use href="#leaf" transform="rotate(210,50,50)"/>
    <use href="#leaf" transform="rotate(240,50,50)"/>
    <use href="#leaf" transform="rotate(270,50,50)"/>
    <use href="#leaf" transform="rotate(300,50,50)"/>
    <use href="#leaf" transform="rotate(330,50,50)"/>
  </g>

  <g fill="none" stroke="#4CAF50">
    <!-- ═══ Wheel rim ═══ -->
    <circle cx="50" cy="50" r="25" stroke-width="3"/>

    <!-- ═══ 6 curved spokes ═══ -->
    <path d="M50 50 Q47 38 50 27" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M50 50 Q62 47 71 41" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M50 50 Q62 53 71 59" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M50 50 Q53 62 50 73" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M50 50 Q38 53 29 59" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M50 50 Q38 47 29 41" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <g fill="#4CAF50">
    <!-- ═══ Central leaf (almond shape, upper half) ═══ -->
    <path d="M50 28 C58 35 58 46 50 52 C42 46 42 35 50 28 Z"/>
  </g>

  <g stroke="#FFFFFF" fill="none" stroke-linecap="round">
    <!-- ═══ Leaf veins (knockout in white over the central leaf) ═══ -->
    <line x1="50" y1="31" x2="50" y2="50" stroke-width="1.4"/>
    <line x1="50" y1="38" x2="45" y2="34" stroke-width="1.1"/>
    <line x1="50" y1="38" x2="55" y2="34" stroke-width="1.1"/>
    <line x1="50" y1="44" x2="46" y2="41" stroke-width="1"/>
    <line x1="50" y1="44" x2="54" y2="41" stroke-width="1"/>
  </g>

  <!-- ═══ Hub ═══ -->
  <circle cx="50" cy="50" r="4.5" fill="#4CAF50"/>
  <circle cx="50" cy="50" r="1.8" fill="#FFFFFF"/>
</svg>
